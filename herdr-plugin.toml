id = "com.elliotekj.herdr-easymotion"
name = "Herdr EasyMotion"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Jump directly between visible panes in the active Herdr tab."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "pane"
title = "Select pane"
contexts = ["pane", "tab", "workspace"]
command = ["node", "src/open-picker.js"]

[[panes]]
id = "picker"
title = "\u200B"
placement = "popup"
width = "100%"
height = "100%"
command = ["node", "src/picker.js"]
